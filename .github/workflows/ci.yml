name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new advisories surface on their own instead of on whichever PR lands next.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Lint
        run: npm run lint
        working-directory: api

      - name: Typecheck
        run: npm run typecheck
        working-directory: api

      - name: Run tests
        run: npm test
        working-directory: api

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Run tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # Builds web/ and serves it with `vite preview` (see e2e/playwright.config.js); the API
      # is mocked in the tests, so no database or API server is needed.
      - name: Run e2e smoke tests
        run: npm test
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Checks a live advisory database, not the code, so a newly published advisory can turn an
  # unrelated PR red; the fix is usually a lockfile-only `npm audit fix`. Blocks on PRs, pushes
  # to main and the weekly run.
  # Production dependencies only: dev-tool advisories don't ship.
  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit API dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: api

      - name: Audit web dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
